[project]
name = "fnotrading"
version = "0.1.0"
description = "Automated F&O Trading System for Indian Markets"
requires-python = ">=3.12"
dependencies = [
    # Broker
    "kiteconnect>=5.0.1",
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Cache
    "redis[hiredis]>=5.2.0",
    # Data & Computation
    "numpy>=2.1.0",
    "numba>=0.60.0",
    "msgspec>=0.18.0",
    "pandas>=2.2.0",
    "scipy>=1.14.0",
    # Validation & Config
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    # Scheduling
    "apscheduler>=3.10.0",
    # HTTP Client
    "httpx>=0.28.0",
    # AI Advisor
    "anthropic>=0.40.0",
    # Logging
    "structlog>=24.4.0",
    # Option Pricing
    "py_vollib>=1.0.1",
    # Columnar storage for the 1-sec tick recorder (Parquet keeps the year-1
    # NIFTY+BANKNIFTY tick archive ~10x smaller than CSV — see tick_recorder.py)
    "pyarrow>=16.0.0",
    # Timezone
    "pytz>=2024.1",
    "pyotp>=2.9.0",
    "breeze-connect>=1.0.67",
    # Secret storage (OS keychain — macOS Keychain, Linux Secret Service, Windows Cred Mgr)
    "keyring>=25.0.0",
    # Cold storage — Backblaze B2 SDK for the upload_to_b2.py uploader.
    # Lazy-imported only inside B2Uploader so the dev/CI LocalDirUploader path
    # never touches it, but still needs to be on the box where the cron runs.
    "b2sdk>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
